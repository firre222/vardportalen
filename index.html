.seg [aria-selected="true"] > .tf-n { background: var(--accent-soft); color: var(--accent); }
.td-explain { margin: 0; padding: 10px 18px; font-size: .86rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.td { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; padding: 16px 18px 16px 20px; border-bottom: 1px solid var(--line); align-items: start; }
.td::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
.td.tone-urgent::before { background: var(--t-rod); }
.td.tone-info::before { background: var(--line); }
.td.tone-urgent .todo-ic { background: var(--danger-soft); color: var(--t-rod); }
.td.tone-info .todo-ic { background: var(--surface-2); color: var(--muted); }
.td-main { display: grid; gap: 4px; min-width: 0; }
.td-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.td-kind { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.td.tone-urgent .td-kind { color: var(--t-rod); }
.td.tone-info .td-kind { color: var(--muted); }
.td-title { font-size: 1.02rem; font-weight: 650; }
.td-meta { display: flex; flex-wrap: wrap; gap: 2px 0; color: var(--muted); font-size: .84rem; }
.td-meta span + span::before { content: "·"; margin: 0 7px; }
.td-quote { display: block; quotes: none; font-size: .92rem; padding: 7px 11px; margin-top: 2px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
.td.tone-urgent .td-quote { border-left-color: var(--t-rod); }
.td-how { margin: 2px 0 0; font-size: .86rem; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.td-how b { color: var(--fg); font-weight: 600; white-space: nowrap; }
.td-btns { display: grid; gap: 6px; align-self: center; min-width: 132px; }
.td-btns .btn { justify-content: center; width: 100%; }
.td .todo-seg { grid-column: 2 / -1; }
@media (max-width: 640px) { .td { grid-template-columns: minmax(0, 1fr); } .td .todo-ic { display: none; } .td-btns { grid-auto-flow: column; justify-content: start; min-width: 0; } .td .todo-seg { grid-column: 1; } .td-how { display: block; } }
.td-done .ea-ic { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.td-quick { grid-template-columns: 1fr !important; padding: 12px; gap: 8px !important; }
.td-quick .qcard { box-shadow: none; padding: 10px 12px; grid-template-columns: 40px minmax(0, 1fr) 16px; }
.td-quick .qcard .qc-ic { width: 40px; height: 40px; }
.td-quick .qcard .badge { left: 40px; top: 4px; }

/* ===== Diagnos: kort, knapp och popup ===== */
.dxc { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rad); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.dxc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ok); }
.dxc-empty::before { background: var(--accent); }
.dxc-empty { background: linear-gradient(90deg, var(--accent-soft), var(--surface) 60%); }
.dxc-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.dxc-ic.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.dxc-ic svg { width: 24px; height: 24px; }
.dxc-main { display: grid; gap: 3px; min-width: 0; }
.dxc-k { display: flex; gap: 8px; align-items: center; font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.dxc-main > b { font-size: 1.08rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dxc-main small { color: var(--muted); font-size: .85rem; }
.dxc-btn { padding: 11px 18px; font-size: .98rem; }
.dxc-btn svg, .ddx-edit svg, .dxc-btns svg, .pbar-dx svg, #dxm-next svg { width: 16px; height: 16px; }
.dxc-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .dxc { grid-template-columns: minmax(0, 1fr); } .dxc-ic { display: none; } .dxc-btns { justify-content: flex-start; } }
.cert { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; text-transform: none; vertical-align: middle; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.cert-trolig { background: var(--accent-soft); color: var(--accent); }
.cert-misstankt { background: color-mix(in srgb, #c98a12 16%, transparent); color: #a8720c; }
.doc-dxrow { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.ddx-main { display: grid; gap: 6px; min-width: 0; }
.ddx-k { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.doc-dxrow .doc-dx { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; font-size: 1.05rem; }
.ddx-tx { display: flex; flex-wrap: wrap; gap: 6px; }
.ddx-tx span { font-size: .8rem; padding: 3px 9px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.ddx-by { font-size: .8rem; color: var(--muted); }
.ddx-edit { flex: none; }
.pbar-dx { white-space: nowrap; }
.dx-note { margin: 0; padding: 12px 18px; font-size: .88rem; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dxm-wrap { z-index: 60; }
.dxm { width: min(880px, 100%); display: flex; flex-direction: column; overflow: hidden !important; max-height: calc(100dvh - 32px); }
.dxm-steps { list-style: none; margin: 0; padding: 10px 20px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; }
.dxm-steps li { flex: 1; min-width: max-content; }
.dxm-steps button { width: 100%; display: flex; gap: 8px; align-items: center; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font: inherit; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; }
.dxm-steps button:disabled { cursor: default; opacity: .7; }
.dxm-steps button span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; border: 2px solid var(--line); background: var(--surface); }
.dxm-steps .on button { color: var(--fg); background: var(--surface); box-shadow: var(--shadow); }
.dxm-steps .on button span { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.dxm-steps .done button span { border-color: var(--ok); background: var(--ok); color: #fff; }
.dxm-body { flex: 1; overflow-y: auto; }
.dxm-body section { display: grid; gap: 12px; }
.dxm-q { width: 100%; font: inherit; font-size: 1rem; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.dxm-q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.dxm-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.dxm-cats .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dxm-list { display: grid; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.dxm-list.dim { opacity: .45; }
.dxm-opt { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 9px 12px; font: inherit; color: var(--fg); cursor: pointer; }
.dxm-opt:last-child { border-bottom: 0; }
.dxm-opt:hover { background: var(--surface-2); }
.dxm-opt.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.dxm-opt .diag-code { justify-self: start; }
.dxm-cat { font-size: .75rem; color: var(--muted); }
@media (max-width: 560px) { .dxm-opt { grid-template-columns: 62px minmax(0, 1fr); } .dxm-cat { display: none; } }
.dxm-none { padding: 14px; }
.dxm-customrow { display: flex; justify-content: flex-end; margin-top: -4px; }
.dxm-chosen { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.dxm-chosen > div { display: grid; gap: 2px; }
.dxm-chosen b { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 1.02rem; }
.dxm-chosen small { color: var(--muted); font-size: .8rem; }
.dxm-chk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; flex: none; }
.dxm-chk svg { width: 16px; height: 16px; }
.dxm-cert { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cert-opt { position: relative; cursor: pointer; }
.cert-opt input { position: absolute; opacity: 0; }
.cert-opt > span { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.cert-opt small { color: var(--muted); font-size: .8rem; }
.cert-opt input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft); }
.cert-opt input:focus-visible + span { outline: 2px solid var(--accent); }
@media (max-width: 560px) { .dxm-cert { grid-template-columns: 1fr; } }
.dxm-under { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.dxm-under .wide { grid-column: 1 / -1; }
.dxm-under dt { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dxm-under dd { margin: 2px 0 0; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.news-chip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 6px; font-size: .78rem; font-weight: 700; background: var(--surface); border: 1px solid var(--line); }
.news-chip.news-hog { background: var(--danger-soft); color: var(--t-rod); border-color: transparent; }
.news-chip.news-medel { background: color-mix(in srgb, #e07a1f 16%, transparent); color: #b45c10; border-color: transparent; }
@media (max-width: 560px) { .dxm-under { grid-template-columns: 1fr; } }
.dxm-checks { display: grid; gap: 8px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; }
.dxm-txhead { display: flex; justify-content: space-between; align-items: center; }
.dxm-tx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .dxm-tx { grid-template-columns: 1fr; } }
.dxm-txi { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); font-size: .92rem; }
.dxm-txi input { margin-top: 3px; accent-color: var(--accent); }
.dxm-txi > span:first-of-type { flex: 1; min-width: 0; }
.dxm-txi.on { border-color: var(--accent); background: var(--accent-soft); }
.dxm-txi.hit { border-color: var(--t-rod); }
.cave-hit { flex-basis: 100%; margin-left: 24px; font-size: .75rem; font-weight: 700; color: var(--t-rod); }
.dxm-cavechk { padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); }
.dxm-sum dl { display: grid; gap: 10px; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
.dxm-sum dl > div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; }
.dxm-sum dt { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.dxm-sum dd { margin: 0; overflow-wrap: anywhere; }
.dxm-sum dd b { display: inline-flex; gap: 8px; align-items: baseline; }
.dxm-sum ul { margin: 0; padding-left: 18px; }
@media (max-width: 560px) { .dxm-sum dl > div { grid-template-columns: 1fr; gap: 2px; } }
.dxm-foot { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.dxm-foot .err { flex: 1; margin: 0; text-align: center; font-size: .88rem; }
.dxm-foot .btn { white-space: nowrap; }
/* Mobil: sidomenyn blir en rad som går att svepa */
@media (max-width: 900px) {
  .shell > * { min-width: 0; }
  .side { height: auto !important; max-width: 100vw; overflow: hidden; border-right: 0; padding-block: 6px; }
  .side .nav { flex-wrap: nowrap; overflow-x: auto; min-width: 0; }
  .side .nav li { flex: none; }
}
@media (max-width: 640px) { #td-filter { display: none; } }
/* ===== Ny utstyrsel: mörk sidomeny, mintgrönt och journalpapper ===== */
:root {
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --bg: #edf1f0; --surface: #ffffff; --surface-2: #f3f7f6; --fg: #13201e; --muted: #5a6967; --line: #dfe6e4;
  --accent: #0e7466; --accent-ink: #ffffff; --accent-soft: #ddefeb; --danger: #c0352a; --danger-soft: #fbe9e6; --ok: #21804d;
  --nav-bg: #0e2523; --nav-fg: #a9c2be; --nav-hi: #eef7f5; --nav-act: #1b3b37; --mint: #5ed2b9;
  --desk: #dde5e3; --paper: #fffefa; --ink: #1a2830;
  --bar: #ffffff; --bar-2: #f3f7f6; --hero-bg: #0e2523;
  --shadow: 0 1px 2px rgba(14, 37, 35, .05), 0 6px 22px rgba(14, 37, 35, .07);
  --rad: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1413; --surface: #13201f; --surface-2: #192927; --fg: #e2eeeb; --muted: #91a6a2; --line: #233634;
    --accent: #4fc4aa; --accent-ink: #052520; --accent-soft: #163632; --danger: #ef6e62; --danger-soft: #3a1c19; --ok: #4cc07c;
    --nav-bg: #08100f; --nav-fg: #8ea7a3; --nav-hi: #e2eeeb; --nav-act: #15302d; --desk: #0a1110; --hero-bg: #08100f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1413; --surface: #13201f; --surface-2: #192927; --fg: #e2eeeb; --muted: #91a6a2; --line: #233634;
  --accent: #4fc4aa; --accent-ink: #052520; --accent-soft: #163632; --danger: #ef6e62; --danger-soft: #3a1c19; --ok: #4cc07c;
  --nav-bg: #08100f; --nav-fg: #8ea7a3; --nav-hi: #e2eeeb; --nav-act: #15302d; --desk: #0a1110; --hero-bg: #08100f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3); color-scheme: dark;
}
body { font-family: var(--sans); letter-spacing: -.005em; background: var(--bg); }
h1, h2, h3 { letter-spacing: -.015em; }

/* Ramverk: sidomenyn går hela vägen upp */
.side-brand { display: none; }
@media (min-width: 901px) {
  #app:has(> .shell) { display: grid; grid-template-columns: 256px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100dvh; }
  #app:has(> .shell) > .topbar { grid-column: 2; grid-row: 1; }
  #app:has(> .shell) > .shell { display: contents; }
  #app > .shell > .side { grid-column: 1; grid-row: 1 / span 2; top: 0 !important; height: 100dvh !important; align-self: start; }
  #app > .shell > .main { grid-column: 2; grid-row: 2; }
  #app:has(> .shell) .tb-brand { display: none; }
  .side-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
}
.side-brand .sb-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--mint); display: grid; place-items: center; flex: none; }
.side-brand .sb-mark svg { width: 20px; height: 20px; }
.side-brand .sb-mark svg path { fill: #0e2523 !important; }
.side-brand b { display: block; color: var(--nav-hi); font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
.side-brand small { display: block; color: var(--nav-fg); font-size: .76rem; }
.side { background: var(--nav-bg) !important; border-right: 0 !important; color: var(--nav-fg); padding-top: 18px !important; }
.side .nav-label { color: rgba(169, 194, 190, .55); padding-top: 16px; }
.side .nav button { color: var(--nav-fg); font-weight: 600; border-radius: 10px !important; padding: 9px 12px !important; }
.side .nav button svg { opacity: .85; }
.side .nav button:hover { background: rgba(255, 255, 255, .06); color: var(--nav-hi); }
.side .nav button[aria-current="page"] { background: var(--nav-act) !important; color: #fff !important; box-shadow: inset 3px 0 0 var(--mint) !important; }
.side .nav button[aria-current="page"] svg { color: var(--mint); opacity: 1; }
.side .badge { background: rgba(255,255,255,.14); color: #fff; }
.side .badge.red { background: #e2493c; }
.side .me { border-top-color: rgba(255, 255, 255, .07); }
.side .me, .side .me p, .side .side-ver { color: var(--nav-fg) !important; }
.topbar { background: color-mix(in srgb, var(--bg) 88%, transparent) !important; backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line) !important; box-shadow: none !important; height: 64px !important; color: var(--fg) !important; }
.tb-search input { background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 12px !important; height: 40px !important; }
.tb-search input:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); outline: 0; }
@media (max-width: 900px) {
  .side { padding-top: 6px !important; top: calc(64px + env(safe-area-inset-top, 0px)) !important; }
  .side .nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--mint) !important; }
}

/* Kort, rubriker och knappar */
.panel, .doc, .qcard, .welcome, .ws-card, .scard, .stat, .bed, .chat, .td-stat, .dxc, .jr-card { border-radius: var(--rad) !important; border: 1px solid transparent !important; box-shadow: var(--shadow) !important; }
.panel-head { border-bottom-color: var(--line); padding: 14px 20px !important; }
.panel-head h2, .ph, .panel-head h2.ph { font-size: 1rem !important; font-weight: 800 !important; text-transform: none !important; letter-spacing: -.01em !important; color: var(--fg); }
.ph-ic { color: var(--accent); }
.grp-head { text-transform: none !important; letter-spacing: 0 !important; font-size: .82rem !important; font-weight: 800; background: var(--surface-2); }
.btn { border-radius: 10px !important; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.chip, .qchip, .tseg { border-radius: 999px !important; }
.tseg button { border-radius: 999px; }
.td-panel .tseg { border: 0; background: var(--surface-2); padding: 3px; gap: 2px; }
.td-panel .tseg button { border: 0 !important; }
.field input, .field select, .field textarea { border-radius: 10px !important; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); outline: 0; }
.page-head { background: transparent !important; border: 0 !important; box-shadow: none !important; padding: 6px 2px 0 !important; }
.page-head h1 { font-size: 1.85rem !important; font-weight: 800 !important; letter-spacing: -.025em !important; }
.page-head .eyebrow { color: var(--accent) !important; font-weight: 800; }
.hero.td-hero { background: radial-gradient(120% 140% at 100% 0%, #1f5a52 0%, transparent 55%), linear-gradient(120deg, #0e2523, #133a36) !important; color: #fff !important; border: 0 !important; border-radius: 20px !important; padding: 26px 30px !important; box-shadow: 0 10px 30px rgba(14,37,35,.18) !important; }
.hero.td-hero h1 { color: #fff !important; font-size: 2rem !important; font-weight: 800; letter-spacing: -.03em; }
.hero.td-hero .eyebrow { color: var(--mint) !important; font-weight: 800; }
.hero.td-hero p#m-sub { color: #c7dbd7 !important; font-size: 1rem; }
.hero.td-hero .hero-btn { background: var(--mint) !important; color: #062420 !important; border-color: var(--mint) !important; }
.td-stat b { font-weight: 800; }
.td-stat::before { width: 5px; }
.crow:hover, .glance-row:hover, .qcard:hover { background: var(--surface-2); }
.qc-ic, .todo-ic, .gl-ic { border-radius: 12px !important; }
.welcome { background: var(--surface) !important; }

/* ===== Journalen ===== */
.drawer.jr { width: 100%; max-width: none; height: 100%; background: var(--desk); display: flex; flex-direction: column; animation: wsin .18s ease-out; box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .drawer.jr { animation: none; } }
.jr-bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); background: var(--nav-bg); color: var(--nav-hi); flex-wrap: wrap; min-height: 60px; }
.jr-back { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-weight: 700; font-size: .88rem; padding: 7px 12px 7px 8px; border-radius: 10px; cursor: pointer; }
.jr-back svg { width: 18px; height: 18px; }
.jr-back:hover { background: rgba(255,255,255,.12); }
.jr-title { display: grid; min-width: 0; }
.jr-title b { font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jr-title > span { color: var(--nav-fg); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jr-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.jr-acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.jr-bar .btn { background: rgba(255,255,255,.08) !important; color: #fff !important; border-color: rgba(255,255,255,.16) !important; }
.jr-bar .btn:hover { background: rgba(255,255,255,.14) !important; }
.jr-bar .btn.primary { background: var(--mint) !important; color: #062420 !important; border-color: var(--mint) !important; }
.jr-bar .btn svg { width: 16px; height: 16px; }
.jr-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr) 350px; }
.jr-toc { overflow-y: auto; padding: 24px 10px 24px 18px; }
.jr-desk { overflow-y: auto; padding: 28px 22px 80px; scroll-padding-top: 16px; }
.jr-rail { overflow-y: auto; padding: 24px 18px 24px 4px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 1320px) { .jr-layout { grid-template-columns: minmax(0, 1fr) 330px; } .jr-toc { display: none; } }
@media (max-width: 960px) { .jr-layout { display: block; overflow-y: auto; } .jr-desk { overflow: visible; padding: 14px 10px 20px; } .jr-rail { overflow: visible; padding: 0 10px 40px; } .jr-tags { display: none; } }
.toc-h { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 10px 10px; }
.jr-toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.jr-toc button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 10px; font: inherit; font-size: .87rem; font-weight: 600; color: var(--fg); cursor: pointer; }
.jr-toc button:hover { background: var(--surface); }
.toc-num { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: var(--accent); box-shadow: var(--shadow); }
.toc-l { flex: 1; min-width: 0; line-height: 1.25; }
.toc-flag { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; display: grid; place-items: center; font-size: .7rem; font-weight: 800; }
.toc-n { font-style: normal; font-size: .72rem; font-weight: 700; color: var(--muted); }
.toc-print { margin-top: 16px; width: 100%; display: flex; gap: 8px; align-items: center; justify-content: center; border: 1px dashed color-mix(in srgb, var(--muted) 50%, transparent); background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: .84rem; padding: 9px; border-radius: 10px; cursor: pointer; }
.toc-print svg { width: 16px; height: 16px; }
.toc-print:hover { color: var(--accent); border-color: var(--accent); }
.jr-card { background: var(--surface); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.jr-card > * { min-width: 0; }
.jr-card h3 { font-size: .98rem; font-weight: 800; margin: 0; }
.jr-next { border-left: 5px solid var(--accent) !important; }
.jr-next.tone-urgent { border-left-color: var(--danger) !important; background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
.jr-next.tone-wait, .jr-next.tone-done { border-left-color: var(--muted) !important; }
.jr-next p { margin: 0; font-weight: 600; }
.jr-next .btn { justify-self: start; }
.jr-k { font-size: .7rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.jr-p { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; }
.jr-p b { display: block; font-size: .92rem; }
.jr-p small { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jr-role { display: block; font-size: .64rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.on { color: var(--ok); font-weight: 700; }
.pp-me { font-size: .75rem; font-weight: 700; color: var(--muted); padding: 0 6px; }
.jr-other { display: flex; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.jr-other select { flex: 1; min-width: 0; font: inherit; font-size: .86rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.jr-chat .cc-msgs { max-height: 420px; min-height: 140px; overflow-y: auto; border-radius: 12px; background: var(--surface-2); padding: 10px; }
.jr-chat .composer { padding: 0; border: 0; background: transparent; }
.jr-admin { max-width: 880px; margin: 18px auto 0; }

/* Journalbladet */
.paper { --surface: #ffffff; --surface-2: #f5f4ee; --fg: var(--ink); --muted: #5e6a70; --line: #e3e0d6; --accent: #0e7466; --accent-soft: #e2f1ed; --danger: #b8322a; --danger-soft: #fbeae7; --ok: #1f7a49;
  color: var(--ink); color-scheme: light; max-width: 880px; margin: 0 auto; background: var(--paper); border-radius: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.05), 0 14px 40px rgba(14,37,35,.16); padding: 44px 52px 34px; counter-reset: pp; position: relative; font-size: 14.5px; }
.paper::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--accent), var(--mint)); border-radius: 6px 6px 0 0; }
.paper .field input, .paper .field select, .paper .field textarea, .paper textarea { background: #fff; color: var(--ink); border-color: #d9d5c8; }
.pp-letter { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.pp-org { display: flex; gap: 11px; align-items: center; }
.pp-org svg { width: 34px; height: 34px; }
.pp-org b { display: block; font-family: var(--serif); font-size: 1.2rem; font-weight: 700; }
.pp-org small { color: var(--muted); font-size: .8rem; }
.pp-docid { display: grid; text-align: right; gap: 1px; }
.pp-docid b { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.pp-docid small { color: var(--muted); font-size: .78rem; }
.pp-ident { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 20px 0 14px; }
.pp-who h1 { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; margin: 0; line-height: 1.12; letter-spacing: -.01em; }
.pp-who > span { color: var(--muted); }
.pp-stamps { display: flex; gap: 8px; flex-wrap: wrap; }
.stamp { border: 2px solid currentColor; border-radius: 5px; padding: 3px 10px; font-weight: 800; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; transform: rotate(-2deg); color: var(--muted); background: transparent; }
.stamp.s-cave { color: #fff; background: var(--danger); border-color: var(--danger); }
.stamp.s-rod { color: #c0302a; } .stamp.s-orange { color: #c46410; } .stamp.s-gul { color: #a07d00; } .stamp.s-gron { color: #23804d; } .stamp.s-bla { color: #2f62a8; }
.stamp.s-news-hog { color: #c0302a; } .stamp.s-news-medel { color: #c46410; } .stamp.s-news-lag, .stamp.s-news-lagmedel { color: #a07d00; }
.stamp.s-st { color: var(--accent); transform: rotate(1.5deg); }
.pp-sec { counter-increment: pp; padding: 20px 0 18px; border-top: 1px solid var(--line); border-radius: 4px; transition: background-color .4s; }
.pp-sec[hidden] { display: none; }
.pp-sec.flash { background: color-mix(in srgb, var(--mint) 14%, transparent); }
.pp-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.pp-n::before { content: counter(pp) "."; }
.pp-n { font-family: var(--serif); color: var(--accent); font-weight: 700; font-size: 1.1rem; }
.pp-h h2 { font-family: var(--serif); font-size: 1.22rem; font-weight: 600; margin: 0; letter-spacing: 0; }
.pp-count { color: var(--muted); font-size: .82rem; margin-left: auto; }
.pp-acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.pp-act { border: 1px solid var(--line); background: #fff; color: var(--accent); font: inherit; font-size: .8rem; font-weight: 800; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.pp-act:hover { border-color: var(--accent); background: var(--accent-soft); }
.pp-act.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.pp-act.pri:hover { filter: brightness(1.08); background: var(--accent); }
.pp-act.warn { color: var(--danger); }
.pp-act.warn:hover { border-color: var(--danger); background: var(--danger-soft); }
.pp-dl { display: grid; gap: 12px 26px; margin: 0; }
.pp-dl.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pp-dl.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pp-dl.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pp-kv.wide { grid-column: 1 / -1; }
.pp-kv dt { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pp-kv dd { margin: 3px 0 0; overflow-wrap: anywhere; }
.pp-empty { color: #a5a9a6; font-style: italic; }
.pp-prose { margin: 0; white-space: pre-wrap; font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; }
.pp-q { font-family: var(--serif); font-size: 1.08rem; font-weight: 600; }
.pp-cave { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 8px 12px; border: 2px solid var(--danger); color: var(--danger); border-radius: 6px; font-weight: 700; }
.pp-cave b { background: var(--danger); color: #fff; padding: 1px 8px; border-radius: 3px; letter-spacing: .12em; font-size: .78rem; }
.pp-muted { color: var(--muted); font-size: .84rem; margin: 10px 0 0; }
.pp-m0 { margin: 0; }
.pp-muted-i { color: var(--muted); font-size: .86rem; }
.pp-vit-top { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; margin-bottom: 14px; }
.pp-news { display: flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.pp-news b { font-size: 2rem; line-height: 1; font-weight: 800; }
.pp-news span { display: grid; font-weight: 800; font-size: .82rem; }
.pp-news small { font-weight: 600; color: var(--muted); }
.pp-news.news-hog { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.pp-news.news-medel { background: #fdf0e3; border-color: transparent; color: #b45c10; }
.pp-vit-now { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; flex: 1; min-width: 280px; }
.pp-vt { display: grid; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; font: inherit; color: var(--ink); }
button.pp-vt { cursor: pointer; }
button.pp-vt:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pp-vt small { font-size: .64rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.pp-vt b { font-size: 1.08rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pp-vt em { font-style: normal; font-size: .68rem; color: var(--muted); }
.pp-vt.flag { border-color: var(--danger); background: var(--danger-soft); }
.pp-vt.flag b { color: var(--danger); }
@media (max-width: 760px) { .pp-vit-now { grid-template-columns: repeat(4, minmax(0, 1fr)); min-width: 0; } }
.pp-tablewrap { overflow-x: auto; }
.pp-table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
.pp-table th { text-align: left; font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1.5px solid var(--ink); padding: 4px 6px; white-space: nowrap; }
.pp-table td { padding: 6px; border-bottom: 1px dotted #cfcabb; white-space: nowrap; }
.pp-table td small { display: block; font-size: .68rem; color: var(--accent); font-weight: 700; }
.pp-table td.flag { color: var(--danger); font-weight: 800; }
.pp-table td.nw-hog { color: var(--danger); font-weight: 800; } .pp-table td.nw-medel { color: #b45c10; font-weight: 800; }
.pp-table tr.latest td { background: var(--accent-soft); }
.pp-dx { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--serif); font-size: 1.35rem; margin-bottom: 12px; }
.pp-dx .diag-code { font-size: .9rem; }
.pp-dxhist { display: grid; gap: 2px; margin-top: 12px; font-size: .82rem; color: var(--muted); }
.pp-dxhist small { font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .66rem; }
.pp-sig { display: flex; gap: 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed #cfcabb; font-size: .86rem; }
.pp-sig img { height: 54px; max-width: 200px; object-fit: contain; }
.pp-sig small { display: block; color: var(--muted); }
.pp-blank { display: flex; gap: 14px; align-items: center; padding: 16px; border: 2px dashed #d3cfc2; border-radius: 8px; color: var(--muted); }
.pp-blank b { color: var(--ink); display: block; }
.pp-blank-ic { width: 42px; height: 42px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.pp-blank-ic svg { width: 22px; height: 22px; }
.pp-tx { list-style: none; margin: 0; padding: 0; display: grid; }
.pp-tx li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 2px; border-bottom: 1px dotted #cfcabb; }
.pp-tick { width: 20px; height: 20px; border: 1.5px solid #9aa3a0; border-radius: 5px; display: grid; place-items: center; background: #fff; }
.pp-tick svg { width: 13px; height: 13px; }
.pp-tx li.done .pp-tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.pp-txt small { display: block; color: var(--ok); font-size: .76rem; font-weight: 700; }
.pp-mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; font: inherit; font-size: .76rem; font-weight: 700; padding: 4px 10px; cursor: pointer; color: var(--accent); white-space: nowrap; }
.pp-mini:hover { border-color: var(--accent); }
.pp-mini.go { background: var(--accent); color: #fff; border-color: var(--accent); }
.pp-mini:disabled { opacity: .5; }
.pp-sub { font-size: .68rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; display: flex; gap: 6px; align-items: center; }
.pp-b > .pp-sub:first-child, .pp-form + .pp-sub { margin-top: 0; }
.pp-form + .pp-sub { margin-top: 4px; }
.pp-person { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px dotted #cfcabb; }
.pp-person b { display: block; }
.pp-person small { color: var(--muted); font-size: .8rem; }
.pp-person .warn { color: var(--danger); font-weight: 700; }
.pp-pbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pp-ins { padding: 9px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; margin-bottom: 6px; display: grid; gap: 4px; }
.pp-ins.akut { border-left-color: var(--danger); }
.pp-ins.mine { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pp-ins p { margin: 0; font-family: var(--serif); font-size: 1rem; }
.pp-ins-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.pp-ins-top b { color: var(--ink); }
.pp-acks { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pp-rep { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 0; border-bottom: 1px dotted #cfcabb; }
.pp-rep p { margin: 0; }
.pp-rep small { color: var(--muted); font-size: .78rem; }
.pp-rep.unread p { font-weight: 600; }
.pp-reply { padding: 9px 12px; border-radius: 8px; background: var(--surface-2); margin-bottom: 6px; display: grid; gap: 4px; }
.pp-reply.new { box-shadow: inset 0 0 0 1.5px var(--danger); }
.pp-reply p { margin: 0; }
.pp-reply small { color: var(--muted); font-size: .78rem; }
.pp-reply .pp-pbtns { justify-content: flex-start; }
.pp-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.pp-hrow { width: 100%; display: grid; grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px dotted #cfcabb; background: transparent; padding: 8px 2px; font: inherit; color: var(--ink); cursor: pointer; }
.pp-hrow:hover { background: var(--surface-2); }
.pp-hrow > span:nth-child(3) { color: var(--muted); font-size: .86rem; }
.pp-form { display: grid; gap: 12px; padding: 16px; margin-bottom: 14px; background: #f4faf8; border: 1.5px solid var(--accent); border-radius: 10px; }
.pp-form .wide { grid-column: 1 / -1; }
.pp-formsub { font-weight: 800; font-size: .92rem; }
.pp-form-acts { display: flex; justify-content: flex-end; gap: 8px; }
.pp-form-acts .btn svg { width: 15px; height: 15px; }
.pp-note { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px; border: 1px dashed #cfcabb; border-radius: 10px; background: #fcfbf6; }
.pp-note textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #d9d5c8; border-radius: 8px; resize: vertical; }
.pp-note .drop { padding: 10px; }
.pp-entry { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 9px 0; border-bottom: 1px dotted #cfcabb; }
.pp-entry time { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; padding-top: 2px; }
.pp-entry b { font-size: .88rem; }
.pp-entry small { color: var(--muted); font-size: .78rem; }
.pp-entry p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.pp-entry.note p { font-family: var(--serif); font-size: 1rem; }
.pp-entry.sys p { color: var(--muted); font-size: .88rem; }
.pp-foot { margin-top: 10px; padding-top: 18px; border-top: 2px solid var(--ink); }
.pp-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.pp-signs > div { display: grid; gap: 1px; align-content: start; }
.pp-signs small { font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pp-signs span { color: var(--muted); font-size: .84rem; }
.pp-signs img { height: 46px; max-width: 200px; object-fit: contain; object-position: left; }
.pp-fine { font-size: .7rem; color: var(--muted); margin: 18px 0 0; text-align: center; letter-spacing: .02em; }
@media (max-width: 760px) {
  .paper { padding: 28px 18px 22px; font-size: 14px; }
  .pp-letter { flex-direction: column; align-items: flex-start; }
  .pp-docid { text-align: left; }
  .pp-who h1 { font-size: 1.6rem; }
  .pp-dl.c3, .pp-dl.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pp-entry { grid-template-columns: 1fr; gap: 2px; }
  .pp-hrow { grid-template-columns: 1fr; gap: 2px; }
  .pp-signs { grid-template-columns: 1fr; gap: 16px; }
  .pp-person, .pp-rep { grid-template-columns: auto minmax(0, 1fr); }
  .pp-person .pp-pbtns, .pp-rep > .pp-mini { grid-column: 2; justify-content: flex-start; justify-self: start; }
}
@media print {
  body > *:not(#drawer) { display: none !important; }
  #drawer, .drawer.jr, .jr-layout, .jr-desk { position: static !important; display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; padding: 0 !important; }
  .jr-bar, .jr-toc, .jr-rail, .jr-admin, .pp-acts, .pp-note, .pp-mini, .pp-form, .pp-pbtns, .scrim { display: none !important; }
  .paper { box-shadow: none !important; max-width: none; padding: 0; }
  .paper::before { display: none; }
}
.login-brand { background: radial-gradient(90% 70% at 100% 0%, #1f5a52 0%, transparent 60%), linear-gradient(160deg, #0e2523, #12332f) !important; color: #fff !important; }
.login-brand .logo-mark { background: var(--mint) !important; border-radius: 12px; }

function sigPad(cv) {

    last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fill(); e.preventDefault();
  });

    ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; e.preventDefault();

  return {
    clear: function () { if (ctx) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); } ink = 0; sized = false; changed(); },
    empty: function () { return ink < 60; },
    data: function () { var w = 420, h = Math.max(1, Math.round(w * cv.height / cv.width)), t = document.createElement('canvas'); t.width = w; t.height = h; t.getContext('2d').drawImage(cv, 0, 0, w, h); return t.toDataURL('image/png'); }
  };
}

  var ak = t.closest('[data-ack]'); if (ak) { var ac = S.cases.find(function (x) { return x.id === ak.dataset.ack; }); if (ac) ackCase(ac); return; }
  var fin = t.closest('[data-task-finish]'); if (fin) { fin.disabled = true; setTaskStatus(fin.dataset.taskFinish, 'klar').then(function () { toast('Uppdraget är klart.'); }).catch(function () { fin.disabled = false; }); return; }
  var dxo = t.closest('[data-dxopen]'); if (dxo && S.me) { openDiagnosis(dxo.dataset.dxopen || S.openCase, Number(dxo.dataset.step) || 0); return; }
  var opd = t.closest('[data-open]'); if (opd && opd.dataset.open) { openCase(opd.dataset.open); if (opd.dataset.openTab) showPane(opd.dataset.openTab); return; }
  if (t.closest('#dock')) return;
  var ch = t.closest('[data-chat]'); if (ch && S.me) { openChat(ch.dataset.chat, ch.dataset.chatCase || null); return; }
  if (t.closest('[data-close]')) { closeDrawer(); return; }
  var sc = t.closest('[data-scroll]'); if (sc) { var el = document.getElementById(sc.dataset.scroll); if (el) el.closest('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  var img = t.closest('[data-img]'); if (img) { var d = S.imgCache[img.dataset.img]; if (d) lightbox(d); return; }
  var del = t.closest('[data-task-del]');
  if (del) {
    var id = del.dataset.taskDel, row = del.closest('.trow');
    if (del.dataset.confirm) { write('tasks/' + id, function () { return S.db.doc('tasks/' + id).delete(); }).then(function () { toast('Uppdraget togs bort.'); }); }
    else { del.dataset.confirm = '1'; del.textContent = 'Bekräfta'; del.classList.add('danger'); setTimeout(function () { if (del.isConnected) { del.dataset.confirm = ''; del.textContent = 'Ta bort'; del.classList.remove('danger'); } }, 4000); }
  }
});
document.addEventListener('change', function (e) {
  var cb = e.target.closest('[data-task-done]'); if (cb) { setTaskStatus(cb.dataset.taskDone, cb.checked ? 'klar' : 'oppen'); return; }
  var ss = e.target.closest('[data-task-status]'); if (ss) setTaskStatus(ss.dataset.taskStatus, ss.value);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { var lb = $('.lightbox'); if (lb) { lb.remove(); return; } if (S.openCase) closeDrawer(); }
});
window.addEventListener('hashchange', function () { if (!S.me) return; var h = location.hash.slice(1); if (h && h !== S.view && VIEWS[h]) { closeDrawer(); go(h); } });

/* ---------- Anslutning ---------- */
function setDbState(s) {
  if (S.dbState === s) return; S.dbState = s;
  if (!S.me) { var tab = $('#f-admin') ? 'admin' : 'personal'; var u = $('#l-user') ? $('#l-user').value : '', p = $('#l-pass') ? $('#l-pass').value : ''; renderLogin(tab); if ($('#l-user')) { $('#l-user').value = u; $('#l-pass').value = p; } }
  else mountView();
}
function subscribe(name, apply) {
  var timer = setTimeout(function () { if (!S.loaded[name]) setDbState('slow'); }, 10000);
  S.db.collection(name).onSnapshot(function (snap) {
    apply(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.loaded[name] = true; if (S.dbState !== 'on' && Object.keys(S.loaded).every(function (k) { return S.loaded[k]; })) setDbState('on'); }
    else S.loaded[name] = S.loaded[name] || snap.size > 0;
    afterData();
  }, function (err) { clearTimeout(timer); S.loaded[name] = true; setDbState(err && err.code === 'revoked' ? 'off' : 'slow'); });
}
var pending = false;
function afterData() {
  if (pending) return; pending = true;
  requestAnimationFrame(function () {
    pending = false;
    if (!S.me) { tryRestore(); return; }
    onData();
  });
}
var restored = false;
function tryRestore() {
  if (restored || !S.loaded.users) return; restored = true;
  var sess = load(SESSION_KEY); if (!sess || !sess.uid) return;
  if (sess.uid === 'admin') { loginAs('admin'); return; }
  var u = userById(sess.uid); if (u && u.active !== false) loginAs(u.id); else store(SESSION_KEY, null);
}
/* Firebase-läge (GitHub Pages): samma gränssnitt som portalens databas och närvaro */
function firebaseRoom(fs) {
  var tab = 'p' + uid(), state = {}, ref = fs.collection('presence').doc(tab), hb = null, last = null, handler = null;
  function push() { return ref.set(Object.assign({}, state, { at: Date.now() })); }
  function emit() {
    if (!last || !handler) return;
    var now = Date.now(), peers = [];
    last.docs.forEach(function (d) {
      var x = d.data() || {}, age = now - (x.at || 0);
      if (age > 864e5 && d.id !== tab) { fs.collection('presence').doc(d.id).delete().catch(function () {}); return; }
      peers.push({ kind: 'viewer', isMe: d.id === tab, sameTab: d.id === tab, presence: age < 65000 ? x : {} });
    });
    handler({ peers: peers });
  }
  window.addEventListener('pagehide', function () { ref.delete().catch(function () {}); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Object.keys(state).length) push().catch(function () {}); });
  setInterval(emit, 30000);
  return {
    presence: function (patch) {
      Object.keys(patch).forEach(function (k) { if (patch[k] === null) delete state[k]; else state[k] = patch[k]; });
      if (!hb) hb = setInterval(function () { push().catch(function () {}); }, 25000);
      return push();
    },
    onPeers: function (h) { handler = h; return fs.collection('presence').onSnapshot(function (snap) { last = snap; emit(); }, function () {}); }
  };
}
async function connect() {
  var cfg = window.LSVP_FIREBASE;
  if (cfg && (!cfg.projectId || /FYLL/i.test(cfg.projectId))) return { db: null, room: null };
  if (cfg && window.firebase && firebase.initializeApp) {
    try {
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      var fs = app.firestore();
      try { fs.settings({ ignoreUndefinedProperties: true }); } catch (e) {}
      return { db: fs, room: firebaseRoom(fs) };
    } catch (e) { return { db: null, room: null }; }
  }
  if (!window.claude || typeof window.claude.use !== 'function') return { db: null, room: null };
  var db = null, room = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (db) { try { room = await window.claude.use('room'); } catch (e) { room = null; } }
  return { db: db, room: room };
}
async function boot() {
  renderLogin();
  var conn = await connect();
  var db = conn.db;
  if (!db) { setDbState('off'); return; }
  S.db = db;
  subscribe('users', function (list) { S.users = list; });
  subscribe('cases', function (list) { S.cases = list; });
  subscribe('tasks', function (list) { S.tasks = list; });
  subscribe('config', function (list) { S.rolesDoc = list.find(function (d) { return d.id === 'roles'; }) || null; });
  subscribe('chat', function (list) {
    S.chatDocs = list;
    Object.keys(S.chatLocal).forEach(function (k) {
      var d = list.find(function (x) { return x.id === k; });
      if (!d) delete S.chatLocal[k];
      else { var lm = S.chatLocal[k], dm = d.msgs || []; if (dm.length && lm.length && dm[dm.length - 1].id === lm[lm.length - 1].id) delete S.chatLocal[k]; }
    });
  });
  var room = conn.room;
  if (room) {
    S.room = room;
    room.onPeers(function (ch) {
      var on = {}, typ = {};
      ch.peers.forEach(function (p) {
        if (p.kind !== 'viewer') return;
        var pr = p.presence || {};
        if (typeof pr.uid === 'string' && pr.uid) {
          on[pr.uid] = true;
          if (typeof pr.typing === 'string' && pr.typing && !(p.isMe && p.sameTab)) typ[pr.uid] = pr.typing;
        }
      });
      S.online = on; S.typing = typ; afterData();
    });
    if (S.me) room.presence({ uid: S.me.id, typing: null }).catch(function () {});
  }
}
boot();
})();
